<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Absensi Bulan Oktober - Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        :root {
            --bg-color: #0b0f19;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            /* Neon Colors */
            --hadir-color: #00ff9d;
            --hadir-glow: rgba(0, 255, 157, 0.3);
            --ijin-color: #ffcc00;
            --ijin-glow: rgba(255, 204, 0, 0.3);
            --sakit-color: #ff0055;
            --sakit-glow: rgba(255, 0, 85, 0.3);
            --libur-color: #a855f7;
            --libur-glow: rgba(168, 85, 247, 0.3);
            --sunday-color: #ff4d4d;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --warning-bg: rgba(255, 0, 85, 0.15); /* Background peringatan < 80% */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 255, 157, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 900px; /* Diperlebar untuk Dashboard */
            padding: 30px 24px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-top: 20px;
        }

        /* Tab Navigasi (TETAP) */
        .tabs-container {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            justify-content: space-between;
        }
        .tab-link {
            flex: 1;
            text-decoration: none;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 10px 0;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .tab-link:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }
        .tab-link.active-tab {
            color: var(--text-main);
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        h2, h3 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-main);
        }

        h3 {
            font-size: 1rem;
            margin-top: 40px;
            color: var(--primary);
        }

        /* Input & Dropdown */
        .filter-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }
        
        select option {
            background: var(--bg-color);
            color: var(--text-main);
        }

        /* Tabel Dashboard */
        .table-responsive {
            overflow-x: auto;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--glass-border);
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        /* Indikator Peringatan (< 80%) */
        .row-warning {
            background-color: var(--warning-bg) !important;
        }
        .row-warning td {
            color: #ffb3c6;
        }

        /* Teks Warna Statis untuk Tabel */
        .txt-hadir { color: var(--hadir-color); font-weight: bold; }
        .txt-ijin { color: var(--ijin-color); font-weight: bold; }
        .txt-sakit { color: var(--sakit-color); font-weight: bold; }
        .txt-libur { color: var(--libur-color); font-weight: bold; }

        /* Calendar Grid Heatmap */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            max-width: 500px;
            margin: 0 auto 30px auto;
        }

        .day-label {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .day-label.sunday { color: var(--sunday-color); }

        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-weight: 400;
            font-size: 0.9rem;
            color: var(--text-muted);
            position: relative; /* Untuk Tooltip */
            user-select: none;
            transition: all 0.3s ease;
        }

        /* Heatmap Active States */
        .day.hadir { background: var(--hadir-color); color: #000; font-weight: 700; box-shadow: 0 0 10px var(--hadir-glow); border: none; }
        .day.ijin { background: var(--ijin-color); color: #000; font-weight: 700; box-shadow: 0 0 10px var(--ijin-glow); border: none; }
        .day.sakit { background: var(--sakit-color); color: #fff; font-weight: 700; box-shadow: 0 0 10px var(--sakit-glow); border: none; }
        .day.libur { background: var(--libur-color); color: #fff; font-weight: 700; box-shadow: 0 0 10px var(--libur-glow); border: none; }

        /* TOOLTIP CSS */
        .day[data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: normal;
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            z-index: 10;
            pointer-events: none;
        }

    </style>
</head>
<body>

<div class="container">
    
    <!-- TAB TETAP SAMA -->
    <div class="tabs-container">
        <a href="#" class="tab-link active-tab">1</a>
        <a href="#" class="tab-link">2</a>
        <a href="#" class="tab-link">3</a>
        <a href="#" class="tab-link">4</a>
        <a href="#" class="tab-link">5</a>
        <a href="#" class="tab-link">6</a>
    </div>

    <h2>Tabel Rekapitulasi (Dashboard Admin)</h2>

    <!-- Filter Dropdown -->
    <div class="filter-container">
        <select id="filterInstansi" onchange="filterTabel()">
            <option value="ALL">Semua Instansi / Sekolah</option>
            <option value="SMK NEGERI 1 SINGKAWANG">SMK NEGERI 1 SINGKAWANG</option>
            <option value="SMK MUDITA SINGKAWANG">SMK MUDITA SINGKAWANG</option>
        </select>
        <select id="filterKelas" onchange="filterTabel()">
            <option value="ALL">Semua Kelas</option>
            <option value="XI TJK">XI TJK</option>
            <option value="XI TJKT">XI TJKT</option>
        </select>
    </div>

    <!-- Tabel Data -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Kelas</th>
                    <th>Sekolah</th>
                    <th>Hadir</th>
                    <th>Ijin</th>
                    <th>Sakit</th>
                    <th>Libur</th>
                    <th>% Hadir</th>
                </tr>
            </thead>
            <tbody id="tbodyRekap">
                <!-- Data akan di-render melalui JS -->
            </tbody>
        </table>
    </div>

    <h3>Tampilan Kalender Visual per Siswa</h3>

    <!-- Pencarian Siswa -->
    <input type="text" id="cariSiswa" list="listSiswa" placeholder="Ketik nama siswa untuk melihat kalender..." autocomplete="off" onchange="renderKalenderSiswa()">
    <datalist id="listSiswa"></datalist>

    <!-- Heatmap Kalender -->
    <div class="calendar-grid" id="calendar">
        <div class="day-label sunday">Min</div><div class="day-label">Sen</div><div class="day-label">Sel</div>
        <div class="day-label">Rab</div><div class="day-label">Kam</div><div class="day-label">Jum</div><div class="day-label">Sab</div>
    </div>
</div>

<script>
    // --- MOCK DATA --- 
    // Di dunia nyata, data ini diambil dari Google Apps Script (GET Request)
    const masterDataSiswa = [
        { sekolah: "SMK NEGERI 1 SINGKAWANG", kelas: "XI TJK", nama: "34 SAEPUL MAJID", hadir: 22, ijin: 1, sakit: 0, libur: 4 },
        { sekolah: "SMK NEGERI 1 SINGKAWANG", kelas: "XI TJK", nama: "35 VIONA", hadir: 18, ijin: 0, sakit: 5, libur: 4 }, // Sakit banyak, persentase turun
        { sekolah: "SMK NEGERI 1 SINGKAWANG", kelas: "XI TJK", nama: "36 WAHYU", hadir: 24, ijin: 0, sakit: 0, libur: 4 },
        { sekolah: "SMK MUDITA SINGKAWANG", kelas: "XI TJKT", nama: "01 ALICIA JENIFER", hadir: 20, ijin: 2, sakit: 1, libur: 4 },
        { sekolah: "SMK MUDITA SINGKAWANG", kelas: "XI TJKT", nama: "02 ANGELA", hadir: 12, ijin: 8, sakit: 3, libur: 4 }, // Sering ijin/sakit (<80%)
        { sekolah: "SMK MUDITA SINGKAWANG", kelas: "XI TJKT", nama: "03 CALVINI", hadir: 23, ijin: 1, sakit: 0, libur: 4 }
    ];

    // Mock Riwayat Harian Siswa untuk Kalender Heatmap
    // Format: { Tanggal: { status: 'hadir/ijin/sakit', timestamp: 'waktu' } }
    const mockRiwayatHarian = {
        "02 ANGELA": {
            1: { status: "hadir", timestamp: "01 Okt 07:15" },
            2: { status: "sakit", timestamp: "02 Okt 08:00 (Surat Dokter)" },
            3: { status: "ijin", timestamp: "03 Okt 07:30 (Keperluan Keluarga)" },
            8: { status: "hadir", timestamp: "08 Okt 07:12" },
            // ... (data lainnya)
        },
        "34 SAEPUL MAJID": {
            1: { status: "hadir", timestamp: "01 Okt 07:05" },
            2: { status: "hadir", timestamp: "02 Okt 07:10" },
            3: { status: "hadir", timestamp: "03 Okt 06:55" },
            4: { status: "libur", timestamp: "04 Okt (Minggu)" }
        }
    };

    function inisialisasiDatalist() {
        const datalist = document.getElementById('listSiswa');
        masterDataSiswa.forEach(siswa => {
            const option = document.createElement('option');
            option.value = siswa.nama;
            option.textContent = `${siswa.kelas} - ${siswa.sekolah}`;
            datalist.appendChild(option);
        });
    }

    function filterTabel() {
        const fInstansi = document.getElementById('filterInstansi').value;
        const fKelas = document.getElementById('filterKelas').value;
        const tbody = document.getElementById('tbodyRekap');
        tbody.innerHTML = "";

        masterDataSiswa.forEach(siswa => {
            // Logika Filter
            const matchInstansi = fInstansi === "ALL" || siswa.sekolah === fInstansi;
            const matchKelas = fKelas === "ALL" || siswa.kelas === fKelas;

            if (matchInstansi && matchKelas) {
                // Hitung Persentase Kehadiran (Asumsi total hari belajar = Hadir + Ijin + Sakit)
                const totalHariBelajar = siswa.hadir + siswa.ijin + siswa.sakit;
                let persentase = 100;
                if(totalHariBelajar > 0) {
                    persentase = Math.round((siswa.hadir / totalHariBelajar) * 100);
                }

                // Baris Peringatan jika < 80%
                const tr = document.createElement('tr');
                if (persentase < 80) {
                    tr.classList.add('row-warning');
                }

                tr.innerHTML = `
                    <td>${siswa.nama}</td>
                    <td>${siswa.kelas}</td>
                    <td>${siswa.sekolah}</td>
                    <td class="txt-hadir">${siswa.hadir}</td>
                    <td class="txt-ijin">${siswa.ijin}</td>
                    <td class="txt-sakit">${siswa.sakit}</td>
                    <td class="txt-libur">${siswa.libur}</td>
                    <td><strong>${persentase}%</strong></td>
                `;
                tbody.appendChild(tr);
            }
        });
    }

    // --- SETUP KALENDER HEATMAP ---
    const calendarEl = document.getElementById('calendar');
    const hariMulai = 4; // 1 Oktober 2026 = Kamis (indeks 4, dimana Min = 0)
    
    // Inisialisasi Grid Kalender Kosong
    function initKalenderGrid() {
        // Hapus tanggal lama (sisakan label hari)
        const days = calendarEl.querySelectorAll('.day, .empty-day');
        days.forEach(d => d.remove());

        // Kotak kosong awal bulan
        for(let i = 0; i < hariMulai; i++) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'empty-day';
            calendarEl.appendChild(emptyDiv);
        }

        // Generate 31 Hari
        for (let i = 1; i <= 31; i++) {
            const dayDiv = document.createElement('div');
            dayDiv.classList.add('day');
            dayDiv.id = `tgl-${i}`;
            dayDiv.textContent = i;
            
            // Tandai hari minggu
            if ((hariMulai + i - 1) % 7 === 0) {
                dayDiv.style.color = "var(--sunday-color)";
                dayDiv.style.backgroundColor = "rgba(255, 77, 77, 0.03)";
                dayDiv.setAttribute('data-tooltip', 'Hari Libur / Minggu');
            }
            
            calendarEl.appendChild(dayDiv);
        }
    }

    // Merender warna pada kalender berdasarkan siswa yang dipilih
    function renderKalenderSiswa() {
        const nama = document.getElementById('cariSiswa').value;
        
        // Reset warna & tooltip semua tanggal
        for (let i = 1; i <= 31; i++) {
            const dayEl = document.getElementById(`tgl-${i}`);
            if(dayEl) {
                dayEl.className = 'day'; // Reset class
                
                // Kembalikan style minggu jika itu hari minggu
                if ((hariMulai + i - 1) % 7 === 0) {
                    dayEl.setAttribute('data-tooltip', 'Hari Minggu');
                } else {
                    dayEl.removeAttribute('data-tooltip'); // Hapus tooltip
                }
            }
        }

        // Jika data siswa ditemukan di mock riwayat
        if (nama && mockRiwayatHarian[nama]) {
            const riwayat = mockRiwayatHarian[nama];
            
            for (const [tgl, data] of Object.entries(riwayat)) {
                const dayEl = document.getElementById(`tgl-${tgl}`);
                if (dayEl) {
                    dayEl.classList.add(data.status); // Beri class warna (hadir/ijin/sakit)
                    // Set Tooltip Timestamp
                    dayEl.setAttribute('data-tooltip', `Status: ${data.status.toUpperCase()} | Dikirim: ${data.timestamp}`);
                }
            }
        }
    }

    // Jalankan fungsi saat web dimuat
    inisialisasiDatalist();
    filterTabel();
    initKalenderGrid();

</script>
</body>
</html>
